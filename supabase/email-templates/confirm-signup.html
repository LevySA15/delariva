<!--
  Template de e-mail para Authentication > Email Templates > Confirm signup
  no painel do Supabase. Cole o conteúdo do <body> abaixo no campo
  "Message body" e use o Subject sugerido no comentário no fim do arquivo.
-->
<body style="margin:0; padding:0; background-color:#0a0a0a; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%;">
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="https://delarivasaj.vercel.app/logo/badge.png" width="72" height="72" alt="DELARIVA" style="display:block; border:0;" />
              <div style="margin-top:12px; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#9a9a9a;">
                Sistema Acadêmico · SAJ
              </div>
            </td>
          </tr>
          <tr>
            <td style="background-color:#141414; border:1px solid #262626; border-radius:12px; padding:32px 28px;">
              <h1 style="margin:0 0 16px; font-size:18px; text-transform:uppercase; letter-spacing:1px; color:#ffffff; text-align:center;">
                Confirme seu e-mail
              </h1>
              <p style="margin:0 0 24px; font-size:14px; line-height:1.6; color:#c4c4c4; text-align:center;">
                Falta pouco para você acessar o sistema da academia. Clique no botão abaixo para confirmar
                seu cadastro e ativar sua conta.
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block; background-color:#dc2626; color:#ffffff; text-decoration:none; font-weight:bold; font-size:14px; padding:12px 32px; border-radius:6px;">
                      Confirmar meu e-mail
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0; font-size:12px; line-height:1.5; color:#7a7a7a; text-align:center;">
                Se você não criou uma conta na DELARIVA, pode ignorar este e-mail.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:20px; font-size:11px; color:#6a6a6a;">
              DELARIVA Jiu-Jitsu
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

<!-- Subject sugerido: Confirme seu cadastro na DELARIVA -->
